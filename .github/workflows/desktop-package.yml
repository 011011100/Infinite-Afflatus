name: Desktop package validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Internal package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Build internal archive or installer and verify packaged contents
        run: pnpm package:local
      - name: Verify renderer observer lifecycle and import and cleanup interactions
        run: pnpm test:browser
      - name: Launch packaged app against an isolated library and verify saved content after restart
        run: node --import tsx tests/browser/packaged-delivery.mjs
      - name: Verify production startup failures preserve the original library
        run: node tests/browser/startup-recovery.cjs
      - name: Verify abrupt process termination, conflict protection and explicit shot recovery
        run: node --import tsx tests/browser/draft-recovery.mjs
      - name: Verify partial reference imports preserve successful files and continued editing
        run: node tests/browser/reference-import.cjs
      - name: Verify cancellation and native close during real large-file reference intake
        run: node tests/browser/reference-import-cancel.cjs
      - name: Verify completed reference intake survives project loss and explicit recovery
        run: node tests/browser/reference-import-unavailable.cjs
      - name: Verify explicit partial-file cleanup preserves complete results and historical files
        run: node tests/browser/staging-cleanup.cjs
      - name: Verify Windows installation, same-version overwrite and retained user data after uninstall
        if: runner.os == 'Windows'
        timeout-minutes: 8
        run: node --import tsx tests/browser/windows-installation.mjs
      - name: Preserve internal build artifacts
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: internal-desktop-${{ matrix.os }}
          path: |
            release/*-internal-*.zip
            release/*-internal-*.exe
          retention-days: 7
          if-no-files-found: error
